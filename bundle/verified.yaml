    description: 流程第7b步（特殊结构）。跟踪多年低位吸筹股的全生命周期：筛选（历史高价股的低价蛰伏区）→熊市抗跌测试→突破N年所有售价=吸筹完成顺势追涨→高位区间反弹不创新高计数转空→跌破区间=派发完成。点评门槛：没有超级耐心不碰；A股壳逻辑随退市改革需重估。当用户问长期横盘票破多年高点、底部大牛股时用。
- capability_id: cap.gann-stockmarket-control-skill.pretrade-checklist
  revision: 1
  status: active
  slug: pretrade-checklist
  title: 开单前12条规则检查（流程第8步·开单闸门）
  importance: critical
  importance_rationale: 第8章全书纪律核心；"要么全守要么全弃"的二值闸门，直接拦截三大致命错误于事前。
  one_liner: 一单未下先过12关：资本量→止损→禁过度交易→浮盈提保本→不逆势→有疑虑退出→活跃股→均摊→不设目标价→卖点四问→累积盈余→分红免疫。
  intents:
  - 帮我按江恩12条规则检查这笔交易能不能做
  - 开仓前需要检查哪些事项
  - 我总管不住手乱开仓怎么办
  keywords: [12条规则, 开单检查, 交易计划, 卖点四问, 过度交易, twelve rules]
  card: cards/pretrade-checklist-skill.md
  promotion: {destination: router}
  also_read: [capital-stop-loss, pyramid-plan]
  frontmatter:
    description: 流程第8步。一单未下先过12关的交易前检查清单（第8章全文规则）：资金档位与单笔风险、止损预设、频率自查、浮盈3~4点提保本、顺势、疑虑即退、标的活跃、均摊方案（点评：<50万资金不必分仓）、放弃目标价（美钢94.875例）、卖点四问、盈余先行、分红免疫。输出通过/不通过+整改项。当用户要开仓评估、管不住手时用；被否决的单不给"部分通过"。
- capability_id: cap.gann-stockmarket-control-skill.capital-stop-loss
  revision: 1
  status: active
  slug: capital-stop-loss
  title: 资金与止损管理（流程第9步）
  importance: critical
  importance_rationale: 止损五条纪律+可亏次数算术是生存件；第8章规则1/2/3/4/11+第27/31章跨章合读。
  one_liner: 先算可亏次数（本金÷单笔风险≥10）再开仓；止损单五纪律=每笔必设/不取消/不上移/越早越好/了结才撤；浮盈3~4点提到保本。
  intents:
  - 这笔该用多少仓位、我能承受多大亏损
  - 止损单怎么设、挂了能不能撤
  - 浮盈怎么保护不成亏损
  keywords: [资金管理, 止损单, 可亏次数, 移动止损, 保本, 仓位, G.T.C., stop loss]
  card: cards/capital-stop-loss-skill.md
  promotion: {destination: router}
  also_read: [pretrade-checklist, pyramid-plan]
  frontmatter:
    description: 流程第9步。资金与风险算术+止损执行纪律：资金档位表（A股换算为单笔风险≤3~5%）、可亏次数≥10的算术、止损单机制（G.T.C.条件单；触发按市价成交可能更差）、五条纪律、浮盈3~4点提保本+止损跟进、连亏两三次退出观望。当用户问仓位/止损执行/浮盈保护时用。跳空跌停可能使止损无法按价成交——A股必须补充此风险提示。
- capability_id: cap.gann-stockmarket-control-skill.breakout-execution
  revision: 1
  status: active
  slug: breakout-execution
  title: 突破买卖执行（流程第10步）
  importance: critical
  importance_rationale: 第22章买卖点位核心落地规则+点评"突破前一切无效"；与止损配对成完整执行件。
  one_liner: 数月/年确立区间的突破才有效：原底（顶）附近进场+区间外3点止损+二次新高加仓更安全；信号出现即市价行动，不挂小差价限价。
  intents:
  - 突破了该追吗、买点止损点设哪
  - 假突破怎么防
  - 首次新高和二次新高买哪个
  keywords: [突破, 突破买入, 3点止损, 二次新高, 假突破, 区间上下沿, breakout]
  card: cards/breakout-execution-skill.md
  promotion: {destination: router}
  also_read: [final-top-bottom, capital-stop-loss]
  frontmatter:
    description: 流程第10步。突破买卖的执行规则：只认数月至数年确立区间的突破；原底（顶）附近进场，止损设区间外3点（换算）；首次新高常回调、二次新高更安全；行情启动立即进场不等回落；不挂小差价限价单（0.125美元教训）；突破后跌回区间=认赔出局。点评：突破前一切分析无效，区间上下限是唯一裁决。当用户问该不该追、买卖点+止损配对时用。
- capability_id: cap.gann-stockmarket-control-skill.pyramid-plan
  revision: 1
  status: active
  slug: pyramid-plan
  title: 金字塔顺势递减加仓计划（流程第11步）
  importance: high
  importance_rationale: 第9章唯一推荐的加仓法+第27/29/31章时机与禁加区；与摊平严格对立是纠错高发点。
  one_liner: 只顺浮盈方向：首仓后每顺行一档（10点≈10%）递减加仓100→50→30→20→10并同步上移止损；吸筹/派发区与顶底10%区禁加；转势之初才启动。
  intents:
  - 浮盈了怎么加仓、每次加多少
  - 金字塔加码和摊平有什么区别
  - 什么情况下不能加仓
  keywords: [金字塔加仓, 递减加码, 摊平, 浮盈加仓, 止损跟进, pyramiding]
  card: cards/pyramid-plan-skill.md
  promotion: {destination: router}
  also_read: [capital-stop-loss, failure-mode-triage-skill]
  frontmatter:
    description: 流程第11步。顺势递减加仓计划表：首仓后每顺行一档加仓且数量递减（100→50→30→20→10股原型，A股按百分比/股数换算）+止损逐级跟进使总风险递减；只在趋势启动初期启动；吸筹/派发区间内与接近顶底10%区禁加；浮亏加码=摊平=三大致命错误之一，一律否决。当用户问加仓节奏、区分加码与摊平时用。
